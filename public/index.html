<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoalTracker">
  <meta name="theme-color" content="#0A0E1A">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>GoalTracker SMART</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🎯 Goal<span>Tracker</span> SMART</h1>
    </header>

    <main class="main-content" id="mainContent">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Ładowanie...</div>
      </div>
    </main>

    <button class="fab" id="fab">+</button>

    <nav class="tab-bar">
      <button class="tab-btn active" data-view="dashboard">
        <span class="icon">📊</span>Dashboard
      </button>
      <button class="tab-btn" data-view="goals">
        <span class="icon">🎯</span>Cele
      </button>
      <button class="tab-btn" data-view="planner">
        <span class="icon">📅</span>Planer
      </button>
      <button class="tab-btn" data-view="risks">
        <span class="icon">⚠️</span>Ryzyka
      </button>
      <button class="tab-btn" data-view="settings">
        <span class="icon">⚙️</span>Info
      </button>
    </nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
